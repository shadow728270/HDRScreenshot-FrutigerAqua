name: Build & Release Windows Executable (Prismwake & Legacy HDRSnipFusion Alias)

on:
  push:
    branches: [ main ]
    paths:
      - 'Prismwake.py'
      - 'HDRSnipFusion.py'
      - 'make_prismwake_icon.py'
      - 'prismwake-mark.svg'
      - 'prismwake_version_info.txt'
      - 'requirements.txt'
      - 'test_prismwake_v014.py'
      - 'test_legacy_updater_contract.py'
      - '.github/workflows/build-windows.yml'
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Verify Prismwake.exe + HDRSnipFusion.exe (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'

      - name: Locate entry-point script & verify APP_VERSION consistency
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $candidates = @("Prismwake.py", "HDRSnipFusion.py", "src/Prismwake.py", "src/HDRSnipFusion.py")
          $entryScript = $null
          foreach ($cand in $candidates) {
            if (Test-Path -LiteralPath $cand) {
              $entryScript = $cand
              break
            }
          }
          if (-not $entryScript) {
            Write-Error "Could not locate Prismwake.py or HDRSnipFusion.py in the repository."
            exit 1
          }

          # Ensure both Prismwake.py and HDRSnipFusion.py exist on runner for tests & backward-compatible imports
          if ((Test-Path -LiteralPath "Prismwake.py") -and (-not (Test-Path -LiteralPath "HDRSnipFusion.py"))) {
            Copy-Item -LiteralPath "Prismwake.py" -Destination "HDRSnipFusion.py" -Force
          } elseif ((Test-Path -LiteralPath "HDRSnipFusion.py") -and (-not (Test-Path -LiteralPath "Prismwake.py"))) {
            Copy-Item -LiteralPath "HDRSnipFusion.py" -Destination "Prismwake.py" -Force
          }

          $content = Get-Content -LiteralPath $entryScript -Raw -Encoding UTF8
          if ($content -match '(?m)^APP_VERSION\s*(?::\s*str\s*)?=\s*["'']([0-9]+\.[0-9]+\.[0-9]+)["'']') {
            $appVersion = $Matches[1]
          } else {
            Write-Error "Failed to parse APP_VERSION = 'X.Y.Z' from $entryScript."
            exit 1
          }

          $isTagPush = $env:GITHUB_REF_TYPE -eq "tag" -or $env:GITHUB_REF -like "refs/tags/v*"
          $tagName = ""
          if ($isTagPush) {
            $tagName = $env:GITHUB_REF_NAME
            $expectedTag = "v$appVersion"
            if ($tagName -ne $expectedTag) {
              Write-Error "Version mismatch! Git tag is '$tagName', but APP_VERSION in $entryScript is '$appVersion' (expected tag '$expectedTag')."
              exit 1
            }
            Write-Host "Verified Git tag '$tagName' matches APP_VERSION '$appVersion' in $entryScript."
          } else {
            Write-Host "Non-tag build on ref '$env:GITHUB_REF': APP_VERSION is '$appVersion'."
          }

          "entry_script=$entryScript" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_tag=$($isTagPush.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install runtime & packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path -LiteralPath "requirements.txt") {
            pip install -r requirements.txt
          } else {
            pip install PyQt6 numpy Pillow
          }
          pip install pyinstaller pytest

      - name: Generate & verify multi-resolution Prismwake Windows icon (.ico), SVG & PE version metadata
        id: icon_gen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appVer = "${{ steps.meta.outputs.app_version }}"

          $genScript = $null
          foreach ($cand in @("make_prismwake_icon.py", "tools/make_prismwake_icon.py")) {
            if (Test-Path -LiteralPath $cand) {
              $genScript = $cand
              break
            }
          }
          if (-not $genScript) {
            Write-Error "Could not locate make_prismwake_icon.py or tools/make_prismwake_icon.py"
            exit 1
          }

          python $genScript (Get-Location).Path $appVer
          if ($LASTEXITCODE -ne 0) { throw "Icon generation failed" }

          if (-not (Test-Path -LiteralPath "prismwake.ico")) {
            Write-Error "make_prismwake_icon.py did not generate prismwake.ico"
            exit 1
          }
          if (-not (Test-Path -LiteralPath "prismwake_version_info.txt")) {
            Write-Error "make_prismwake_icon.py did not generate prismwake_version_info.txt"
            exit 1
          }

          # Verify all 7 standard Windows icon frames (16, 24, 32, 48, 64, 128, 256) exist in prismwake.ico
          python -c "import pathlib, make_prismwake_icon as g; frames = g.inspect_ico_frames(pathlib.Path('prismwake.ico')); widths = [w for w, h, bpp in frames]; assert widths == [16, 24, 32, 48, 64, 128, 256], f'Unexpected ICO frames: {frames}'; print('Verified multi-size prismwake.ico frames:', frames)"

      - name: Run headless verification, Settings geometry & legacy compatibility test suites on source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $entry = "${{ steps.meta.outputs.entry_script }}"
          $expectedVer = "${{ steps.meta.outputs.app_version }}"

          $verOut = (python $entry --version | Out-String).Trim()
          Write-Host "Source --version output: $verOut"
          if ($verOut -notlike "*Prismwake v$expectedVer*" -and $verOut -notlike "*HDRSnip Fusion v$expectedVer*") {
            Write-Error "Unexpected --version output from source: '$verOut'"
            exit 1
          }

          $srcVerJsonPath = Join-Path $env:RUNNER_TEMP "source_version_check.json"
          if (Test-Path -LiteralPath $srcVerJsonPath) { Remove-Item -LiteralPath $srcVerJsonPath -Force }
          python $entry --write-version-file $srcVerJsonPath
          if (-not (Test-Path -LiteralPath $srcVerJsonPath)) {
            Write-Error "Source --write-version-file did not create $srcVerJsonPath"
            exit 1
          }
          $srcVerObj = Get-Content -LiteralPath $srcVerJsonPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($srcVerObj.version -ne $expectedVer -or $srcVerObj.app -ne "Prismwake") {
            Write-Error "Source --write-version-file mismatch: got '$($srcVerObj | ConvertTo-Json -Compress)'"
            exit 1
          }

          # Keep historical version-specific tests frozen. Do not run v0.1.3
          # candidate assertions as if they described the current release.
          if (Test-Path -LiteralPath "tests/test_legacy_updater_contract.py") {
            python -m unittest discover -s tests -p "test_legacy_updater_contract.py" -v
            if ($LASTEXITCODE -ne 0) { throw "Frozen v0.1.2 updater suite failed" }
          }
          if (Test-Path -LiteralPath "test_legacy_updater_contract.py") {
            python test_legacy_updater_contract.py
            if ($LASTEXITCODE -ne 0) { throw "Cross-version updater suite failed" }
          }
          if (Test-Path -LiteralPath "test_prismwake_v014.py") {
            python test_prismwake_v014.py
            if ($LASTEXITCODE -ne 0) { throw "v0.1.4 tests failed" }
          }

      - name: Build single-file Windows executable with PyInstaller (Prismwake.exe + HDRSnipFusion.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $entry = "${{ steps.meta.outputs.entry_script }}"

          $dataArgs = @("--add-data", "prismwake.ico;.")
          if (Test-Path -LiteralPath "prismwake-mark.svg") {
            $dataArgs += @("--add-data", "prismwake-mark.svg;.")
          }

          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "Prismwake" `
            --icon "prismwake.ico" `
            --version-file "prismwake_version_info.txt" `
            --collect-submodules PyQt6 `
            @dataArgs `
            $entry
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }

          $prismwakeExe = Join-Path (Get-Location) "dist\Prismwake.exe"
          $legacyExe = Join-Path (Get-Location) "dist\HDRSnipFusion.exe"
          if (-not (Test-Path -LiteralPath $prismwakeExe)) {
            Write-Error "PyInstaller did not produce expected executable at $prismwakeExe"
            exit 1
          }

          # Create byte-identical HDRSnipFusion.exe alias for seamless v0.1.1 / v0.1.2 / v0.1.3 updater compatibility
          Copy-Item -LiteralPath $prismwakeExe -Destination $legacyExe -Force

      - name: Verify compiled Prismwake.exe & HDRSnipFusion.exe (PE64 headers, embedded icon, PE FileVersionInfo & identical SHA-256)
        id: verify_exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prismwakeExe = Join-Path (Get-Location) "dist\Prismwake.exe"
          $legacyExe = Join-Path (Get-Location) "dist\HDRSnipFusion.exe"
          $expectedVer = "${{ steps.meta.outputs.app_version }}"

          foreach ($exePath in @($prismwakeExe, $legacyExe)) {
            if (-not (Test-Path -LiteralPath $exePath)) {
              Write-Error "Missing expected built executable: $exePath"
              exit 1
            }
            $item = Get-Item -LiteralPath $exePath
            if ($item.Length -lt 5242880) {
              Write-Error "$($item.Name) size ($($item.Length) bytes) is unexpectedly small (< 5 MB)."
              exit 1
            }
            python -c "import sys, pathlib; sys.path.insert(0, '.'); import Prismwake as m; ok, reason = m.validate_windows_pe_executable(pathlib.Path(r'$exePath')); print('PE check for', r'$exePath', ':', ok, reason); sys.exit(0 if ok else 1)"
            if ($LASTEXITCODE -ne 0) { throw "PE validation failed for $exePath" }

            # Verify Windows PE VersionInfo metadata (ProductName, FileDescription, ProductVersion)
            $fvi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exePath)
            Write-Host "PE FileVersionInfo for $($item.Name): ProductName='$($fvi.ProductName)', FileDescription='$($fvi.FileDescription)', FileVersion='$($fvi.FileVersion)', ProductVersion='$($fvi.ProductVersion)'"
            if ($fvi.ProductName -notlike "*Prismwake*" -or $fvi.FileDescription -notlike "*Prismwake*") {
              Write-Error "PE VersionInfo ProductName/FileDescription missing 'Prismwake' on $($item.Name)"
              exit 1
            }
            if (-not $fvi.FileVersion.StartsWith($expectedVer)) {
              Write-Error "PE FileVersion '$($fvi.FileVersion)' does not start with expected '$expectedVer'"
              exit 1
            }

            $verJsonPath = Join-Path $env:RUNNER_TEMP "compiled_ver_$($item.BaseName).json"
            if (Test-Path -LiteralPath $verJsonPath) { Remove-Item -LiteralPath $verJsonPath -Force }
            $proc = Start-Process -FilePath $exePath -ArgumentList @("--write-version-file", $verJsonPath) -Wait -PassThru -WindowStyle Hidden
            if ($proc.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $verJsonPath)) {
              Write-Error "Compiled $($item.Name) --write-version-file failed (exit=$($proc.ExitCode))"
              exit 1
            }
            $verData = Get-Content -LiteralPath $verJsonPath -Raw -Encoding UTF8 | ConvertFrom-Json
            Write-Host "Compiled $($item.Name) version payload: $($verData | ConvertTo-Json -Compress)"
            if ($verData.version -ne $expectedVer -or $verData.tag -ne "v$expectedVer" -or -not $verData.packaged) {
              Write-Error "Compiled $($item.Name) reported unexpected version metadata: $($verData | ConvertTo-Json -Compress)"
              exit 1
            }
          }

          $shaPrism = (Get-FileHash -LiteralPath $prismwakeExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaLegacy = (Get-FileHash -LiteralPath $legacyExe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($shaPrism -ne $shaLegacy) {
            Write-Error "SHA-256 mismatch between Prismwake.exe ($shaPrism) and HDRSnipFusion.exe ($shaLegacy)!"
            exit 1
          }

          $sizeBytes = (Get-Item -LiteralPath $prismwakeExe).Length
          "$shaPrism  Prismwake.exe" | Out-File -FilePath (Join-Path (Get-Location) "dist\Prismwake.exe.sha256") -Encoding ascii -NoNewline
          "$shaLegacy  HDRSnipFusion.exe" | Out-File -FilePath (Join-Path (Get-Location) "dist\HDRSnipFusion.exe.sha256") -Encoding ascii -NoNewline
          Write-Host "Verified identical SHA-256 for Prismwake.exe & HDRSnipFusion.exe: $shaPrism ($sizeBytes bytes)"

          "prismwake_exe=$prismwakeExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe_path=$legacyExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$shaPrism" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size_bytes=$sizeBytes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify two-EXE PyInstaller --onefile --windowed updater, PID ancestry, rollback & staging cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $entry = "${{ steps.meta.outputs.entry_script }}"
          $baseExe = "${{ steps.verify_exe.outputs.exe_path }}"
          $baseVer = "${{ steps.meta.outputs.app_version }}"

          $verParts = $baseVer.Split(".")
          $nextPatch = [int]$verParts[2] + 1
          $nextVer = "$($verParts[0]).$($verParts[1]).$nextPatch"

          $testRoot = Join-Path $env:RUNNER_TEMP "prismwake_two_exe_updater_test"
          if (Test-Path -LiteralPath $testRoot) {
            Remove-Item -LiteralPath $testRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null

          $nextSrc = Join-Path $testRoot "Prismwake_vNext.py"
          $rawSrc = Get-Content -LiteralPath $entry -Raw -Encoding UTF8
          $patchedSrc = [regex]::Replace(
            $rawSrc,
            '(?m)^APP_VERSION\s*(?::\s*str\s*)?=\s*["''][0-9]+\.[0-9]+\.[0-9]+["'']',
            "APP_VERSION: str = `"$nextVer`""
          )
          Set-Content -LiteralPath $nextSrc -Value $patchedSrc -Encoding UTF8

          Write-Host "Building second real PyInstaller --onefile --windowed executable (v$nextVer) for updater test..."
          $pyiWork = Join-Path $testRoot "build"
          $pyiDist = Join-Path $testRoot "dist_next"
          $pyiSpec = Join-Path $testRoot "spec"
          # PyInstaller resolves resources relative to --specpath; use absolute paths.
          $iconAbs = (Resolve-Path -LiteralPath "prismwake.ico").Path
          $versionAbs = (Resolve-Path -LiteralPath "prismwake_version_info.txt").Path
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "Prismwake_vNext" `
            --icon $iconAbs `
            --version-file $versionAbs `
            --workpath $pyiWork `
            --distpath $pyiDist `
            --specpath $pyiSpec `
            --collect-submodules PyQt6 `
            $nextSrc

          $nextExe = Join-Path $pyiDist "Prismwake_vNext.exe"
          if (-not (Test-Path -LiteralPath $nextExe)) {
            Write-Error "Failed to build second test executable at $nextExe"
            exit 1
          }

          $testScript = Join-Path $testRoot "run_two_exe_validation.py"
          $pyCode = @'
          import json
          import os
          from pathlib import Path
          import secrets
          import shutil
          import subprocess
          import sys

          sys.path.insert(0, os.getcwd())
          import Prismwake as m

          base_exe_src = Path(sys.argv[1]).resolve()
          next_exe_src = Path(sys.argv[2]).resolve()
          base_ver = sys.argv[3].strip()
          next_ver = sys.argv[4].strip()
          work_root = Path(sys.argv[5]).resolve()

          install_dir = work_root / "install"
          staging_root = work_root / "updates"
          install_dir.mkdir(parents=True, exist_ok=True)
          staging_root.mkdir(parents=True, exist_ok=True)

          # Test legacy HDRSnipFusion.exe installed binary upgrading to vNext via Prismwake.exe staged asset
          installed_exe = install_dir / "HDRSnipFusion.exe"
          shutil.copy2(base_exe_src, installed_exe)
          base_sha = m.compute_file_sha256(installed_exe)
          next_sha = m.compute_file_sha256(next_exe_src)
          assert base_sha != next_sha, "Base EXE and Next EXE SHA-256 must differ"

          # 1. Test real PyInstaller --onefile bootloader parent PID vs Python child PID
          confirm_1 = staging_root / "test_pid_confirm.json"
          token_1 = secrets.token_hex(32)
          env_1 = m._build_clean_pyinstaller_env()
          env_1["HDRSNIP_STARTUP_CONFIRM_TOKEN"] = token_1
          proc_1 = subprocess.Popen(
              [
                  str(installed_exe),
                  "--restarted-after-update",
                  "--confirm-startup-file",
                  str(confirm_1),
                  "--confirm-startup-token",
                  token_1,
                  "--verify-startup-only",
              ],
              env=env_1,
              cwd=str(install_dir),
          )
          ok_1, reason_1 = m._wait_for_startup_confirmation(
              proc_1,
              confirm_file=confirm_1,
              expected_version=base_ver,
              expected_token=token_1,
              expected_executable=installed_exe,
              timeout_sec=20.0,
              verify_executable_path=True,
              allow_clean_exit_after_confirm=True,
          )
          assert ok_1, f"Bootloader/Child startup confirmation failed: {reason_1}"
          payload_1 = json.loads(confirm_1.read_text(encoding="utf-8"))
          assert int(payload_1["pid"]) != int(proc_1.pid)
          assert int(payload_1["ppid"]) == int(proc_1.pid)
          confirm_1.unlink(missing_ok=True)
          proc_1.wait(timeout=10.0)

          # 2. Test active staging protection & successful update (base_ver -> next_ver)
          vnext_dir = staging_root / f"v{next_ver}"
          vnext_dir.mkdir(parents=True, exist_ok=True)
          staged_next = vnext_dir / "Prismwake.exe"
          shutil.copy2(next_exe_src, staged_next)

          helper_exe, manifest_path = m.prepare_staged_update_transaction(
              staged_exe=staged_next,
              target_version=next_ver,
              expected_sha256=next_sha,
              target_exe=installed_exe,
              restart_after_update=True,
              staging_root=staging_root,
          )
          assert m.compute_file_sha256(helper_exe) == base_sha
          assert (vnext_dir / m.ACTIVE_TRANSACTION_LOCK_FILENAME).exists()

          m.cleanup_stale_update_staging(next_ver, staging_root)
          assert staged_next.exists() and manifest_path.exists() and helper_exe.exists()

          os.environ["HDRSNIP_VERIFY_STARTUP_ONLY"] = "1"
          try:
              rc_update = m.run_staged_update_helper(
                  str(manifest_path),
                  allowed_staging_root=staging_root,
                  post_launch_verify_sec=25.0,
              )
          finally:
              os.environ.pop("HDRSNIP_VERIFY_STARTUP_ONLY", None)

          assert rc_update == 0, f"Expected run_staged_update_helper rc=0, got {rc_update}"
          assert m.compute_file_sha256(installed_exe) == next_sha

          # 3. Test failed startup & hung child process-tree termination + rollback
          vfail_dir = staging_root / "v9.9.9"
          vfail_dir.mkdir(parents=True, exist_ok=True)
          staged_fail = vfail_dir / "HDRSnipFusion.exe"
          shutil.copy2(base_exe_src, staged_fail)

          helper_fail, manifest_fail = m.prepare_staged_update_transaction(
              staged_exe=staged_fail,
              target_version="9.9.9",
              expected_sha256=base_sha,
              target_exe=installed_exe,
              restart_after_update=False,
              staging_root=staging_root,
          )
          os.environ["HDRSNIP_SIMULATE_HUNG_STARTUP"] = "1"
          try:
              rc_fail = m.run_staged_update_helper(
                  str(manifest_fail),
                  allowed_staging_root=staging_root,
                  post_launch_verify_sec=3.0,
              )
          finally:
              os.environ.pop("HDRSNIP_SIMULATE_HUNG_STARTUP", None)

          assert rc_fail == 6
          assert m.compute_file_sha256(installed_exe) == next_sha

          # 4. Test post-transaction staging cleanup
          m.cleanup_stale_update_staging(next_ver, staging_root)
          assert not vnext_dir.exists()
          print("ALL TWO-EXE WINDOWS PYINSTALLER UPDATER CHECKS PASSED!")
          '@
          Set-Content -LiteralPath $testScript -Value $pyCode -Encoding UTF8
          python $testScript $baseExe $nextExe $baseVer $nextVer $testRoot
          if ($LASTEXITCODE -ne 0) { throw "Two EXE update/rollback integration tests failed" }
          Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload Windows build artifacts (Prismwake.exe + HDRSnipFusion.exe + icon + checksums)
        uses: actions/upload-artifact@v4
        with:
          name: Prismwake-Windows-x64-v${{ steps.meta.outputs.app_version }}
          path: |
            dist/Prismwake.exe
            dist/Prismwake.exe.sha256
            dist/HDRSnipFusion.exe
            dist/HDRSnipFusion.exe.sha256
            prismwake.ico
            prismwake_version_info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish & attach Prismwake.exe and HDRSnipFusion.exe to GitHub Release (Tag push only)
        if: steps.meta.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.meta.outputs.tag_name }}"
          $ver = "${{ steps.meta.outputs.app_version }}"
          $prismwakeExe = "${{ steps.verify_exe.outputs.prismwake_exe }}"
          $legacyExe = "${{ steps.verify_exe.outputs.exe_path }}"
          $sha256 = "${{ steps.verify_exe.outputs.sha256 }}"
          $sizeBytes = "${{ steps.verify_exe.outputs.size_bytes }}"

          $notesFile = Join-Path $env:RUNNER_TEMP "release_notes_$tag.md"
          $notesLines = @(
            "## Prismwake $tag — Catch the light. Keep the detail.",
            "*(Formerly HDRSnip Fusion — 100% backward-compatible upgrade)*",
            "",
            "### Official Standalone Windows 10/11 Executables",
            "- **Primary Asset**: ``Prismwake.exe`` (64-bit standalone PyInstaller build with multi-resolution Prismwake icon & PE version metadata)",
            "- **Legacy Updater Compatibility Asset**: ``HDRSnipFusion.exe`` (byte-identical to ``Prismwake.exe`` for automatic updates from v0.1.1/v0.1.2/v0.1.3)",
            "- **Version**: ``v$ver``",
            "- **Size**: ``$sizeBytes`` bytes",
            "- **SHA-256**: ``$sha256``",
            "",
            "```text",
            "$sha256  Prismwake.exe",
            "$sha256  HDRSnipFusion.exe",
            "```"
          )
          $notesLines -join "`n" | Out-File -FilePath $notesFile -Encoding utf8

          gh release view $tag --repo "${{ github.repository }}" *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if (-not $releaseExists) {
            gh release create $tag `
              "$prismwakeExe#Prismwake.exe" `
              "dist\Prismwake.exe.sha256#Prismwake.exe.sha256" `
              "$legacyExe#HDRSnipFusion.exe" `
              "dist\HDRSnipFusion.exe.sha256#HDRSnipFusion.exe.sha256" `
              --repo "${{ github.repository }}" `
              --title "Prismwake $tag (formerly HDRSnip Fusion)" `
              --notes-file $notesFile `
              --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "GitHub release create failed" }
          } else {
            gh release upload $tag `
              "$prismwakeExe#Prismwake.exe" `
              "dist\Prismwake.exe.sha256#Prismwake.exe.sha256" `
              "$legacyExe#HDRSnipFusion.exe" `
              "dist\HDRSnipFusion.exe.sha256#HDRSnipFusion.exe.sha256" `
              --repo "${{ github.repository }}" `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw "GitHub release upload failed" }
          }

      - name: Verify published GitHub Release dual assets & digest metadata
        if: steps.meta.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.meta.outputs.tag_name }}"
          $expectedSha = "${{ steps.verify_exe.outputs.sha256 }}"
          $expectedSize = [int64]"${{ steps.verify_exe.outputs.size_bytes }}"

          $relJson = gh api "repos/${{ github.repository }}/releases/tags/$tag"
          $rel = $relJson | ConvertFrom-Json

          foreach ($reqName in @("Prismwake.exe", "HDRSnipFusion.exe")) {
            $exeAsset = $rel.assets | Where-Object { $_.name -eq $reqName } | Select-Object -First 1
            if (-not $exeAsset) {
              Write-Error "GitHub Release $tag is missing required asset '$reqName'!"
              exit 1
            }
            if ($exeAsset.state -ne "uploaded") {
              Write-Error "$reqName asset state is '$($exeAsset.state)' (expected 'uploaded')."
              exit 1
            }
            if ([int64]$exeAsset.size -ne $expectedSize) {
              Write-Error "Uploaded $reqName size ($($exeAsset.size)) does not match built size ($expectedSize)."
              exit 1
            }
            if ($exeAsset.digest -and ($exeAsset.digest -ne "sha256:$expectedSha")) {
              Write-Error "Uploaded $reqName digest '$($exeAsset.digest)' does not match expected 'sha256:$expectedSha'."
              exit 1
            }
            Write-Host "Successfully verified $reqName on GitHub Release $tag (url=$($exeAsset.browser_download_url))."
          }