name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "HDRSnipFusion.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -U pip pyinstaller PyQt6 numpy Pillow
      - name: Build executable
        run: python -m PyInstaller --onefile --windowed --clean --noconfirm --name "HDRSnipFusion" "HDRSnipFusion.py"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDRSnipFusion-Windows
          path: dist/HDRSnipFusion.exe
      - name: Attach executable to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/HDRSnipFusion.exe" --clobber
