name: Build & Release Prismwake Windows Executable (Single-EXE Architecture)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Verify Prismwake.exe (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Locate canonical Prismwake.py & verify APP_VERSION = "0.2.0"
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $entryScript = "Prismwake.py"
          if (-not (Test-Path -LiteralPath $entryScript)) {
            Write-Error "Could not locate canonical Prismwake.py in the repository root."
            exit 1
          }

          $content = Get-Content -LiteralPath $entryScript -Raw -Encoding UTF8
          if ($content -match '(?m)^APP_VERSION\s*(?::\s*str\s*)?=\s*["'']([0-9]+\.[0-9]+\.[0-9]+)["'']') {
            $appVersion = $Matches[1]
          } else {
            Write-Error "Failed to parse APP_VERSION = 'X.Y.Z' from $entryScript."
            exit 1
          }

          $isTagPush = $env:GITHUB_REF_TYPE -eq "tag" -or $env:GITHUB_REF -like "refs/tags/v*"
          $tagName = ""
          if ($isTagPush) {
            $tagName = $env:GITHUB_REF_NAME
            $expectedTag = "v$appVersion"
            if ($tagName -ne $expectedTag) {
              Write-Error "Version mismatch! Git tag is '$tagName', but APP_VERSION in $entryScript is '$appVersion' (expected tag '$expectedTag')."
              exit 1
            }
            Write-Host "Verified Git tag '$tagName' matches APP_VERSION '$appVersion' in $entryScript."
          } else {
            Write-Host "Non-tag build on ref '$env:GITHUB_REF': APP_VERSION is '$appVersion'."
          }

          "entry_script=$entryScript" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_tag=$($isTagPush.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install runtime, neural OCR & packaging dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install pyinstaller pytest
          python -c "import onnxruntime, rapidocr; print('Verified neural OCR packages:', onnxruntime.__version__, rapidocr.__version__)"

      - name: Stage & verify offline RapidOCR ONNX models and Tesseract fallback runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rapidModelsDir = Join-Path (Get-Location) "rapidocr_models"
          New-Item -ItemType Directory -Path $rapidModelsDir -Force | Out-Null
          python tools/stage_rapidocr_models.py --output-dir $rapidModelsDir --strict
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $rapidModelsDir "model_manifest.json"))) {
            Write-Error "Failed to stage and verify offline RapidOCR ONNX models!"
            exit 1
          }

          $bundleDir = Join-Path (Get-Location) "tesseract_bundle"
          $tessdataDir = Join-Path $bundleDir "tessdata"
          New-Item -ItemType Directory -Path $tessdataDir -Force | Out-Null

          if (-not (Test-Path -LiteralPath (Join-Path $bundleDir "tesseract.exe"))) {
            choco install tesseract --no-progress -y
            $chocoTess = "C:\Program Files\Tesseract-OCR"
            if (Test-Path -LiteralPath $chocoTess) {
              Copy-Item -Path "$chocoTess\*.exe" -Destination $bundleDir -Force
              Copy-Item -Path "$chocoTess\*.dll" -Destination $bundleDir -Force
              if (Test-Path -LiteralPath "$chocoTess\tessdata\eng.traineddata") {
                Copy-Item -LiteralPath "$chocoTess\tessdata\eng.traineddata" -Destination $tessdataDir -Force
              }
            }
          }

          foreach ($lang in @("eng", "ita")) {
            $tdFile = Join-Path $tessdataDir "$lang.traineddata"
            if (-not (Test-Path -LiteralPath $tdFile)) {
              $url = "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/$lang.traineddata"
              Invoke-WebRequest -Uri $url -OutFile $tdFile -UseBasicParsing
            }
          }
          Write-Host "Staged offline RapidOCR ONNX models in $rapidModelsDir & Tesseract fallback runtime in $bundleDir"

      - name: Generate & verify multi-resolution Prismwake Windows icon (.ico), SVG & PE version metadata
        id: icon_gen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appVer = "${{ steps.meta.outputs.app_version }}"

          $genScript = $null
          foreach ($cand in @("make_prismwake_icon.py", "tools/make_prismwake_icon.py")) {
            if (Test-Path -LiteralPath $cand) {
              $genScript = $cand
              break
            }
          }
          if (-not $genScript) {
            Write-Error "Could not locate make_prismwake_icon.py"
            exit 1
          }

          python $genScript (Get-Location).Path $appVer

          if (-not (Test-Path -LiteralPath "prismwake.ico")) {
            Write-Error "make_prismwake_icon.py did not generate prismwake.ico"
            exit 1
          }
          if (-not (Test-Path -LiteralPath "prismwake_version_info.txt")) {
            Write-Error "make_prismwake_icon.py did not generate prismwake_version_info.txt"
            exit 1
          }

          python -c "import pathlib, make_prismwake_icon as g; frames = g.inspect_ico_frames(pathlib.Path('prismwake.ico')); widths = [w for w, h, bpp in frames]; assert widths == [16, 24, 32, 48, 64, 128, 256], f'Unexpected ICO frames: {frames}'; print('Verified multi-size prismwake.ico frames:', frames)"

      - name: Run automated test suites & side-by-side neural evaluation on source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $entry = "${{ steps.meta.outputs.entry_script }}"
          $expectedVer = "${{ steps.meta.outputs.app_version }}"

          $verOut = (python $entry --version | Out-String).Trim()
          Write-Host "Source --version output: $verOut"
          if ($verOut -notlike "*Prismwake v$expectedVer*") {
            Write-Error "Unexpected --version output from source: '$verOut'"
            exit 1
          }

          $srcVerJsonPath = Join-Path $env:RUNNER_TEMP "source_version_check.json"
          if (Test-Path -LiteralPath $srcVerJsonPath) { Remove-Item -LiteralPath $srcVerJsonPath -Force }
          python $entry --write-version-file $srcVerJsonPath
          $srcVerObj = Get-Content -LiteralPath $srcVerJsonPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($srcVerObj.version -ne $expectedVer -or $srcVerObj.app -ne "Prismwake") {
            Write-Error "Source --write-version-file mismatch: got '$($srcVerObj | ConvertTo-Json -Compress)'"
            exit 1
          }

          python -u tests/run_headless_tests.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Headless test suite failed with exit code $LASTEXITCODE"
            exit 1
          }
          python -u tests/smoke_qt_gui.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Native PyQt6 GUI smoke test failed with exit code $LASTEXITCODE"
            exit 1
          }
          python -u -m ocr.eval_side_by_side --require-neural --output-json BENCHMARK_OCR_V020.json --output-md BENCHMARK_OCR_V020.md
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Side-by-side neural OCR evaluation failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Build single-file Windows executable with PyInstaller (Prismwake.exe only)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $entry = "${{ steps.meta.outputs.entry_script }}"

          $dataArgs = @(
            "--add-data", "prismwake.ico;.",
            "--add-data", "THIRD_PARTY_LICENSES.md;.",
            "--add-data", "tesseract_bundle;tesseract_bundle",
            "--add-data", "rapidocr_models;rapidocr_models"
          )
          if (Test-Path -LiteralPath "prismwake-mark.svg") {
            $dataArgs += @("--add-data", "prismwake-mark.svg;.")
          }

          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "Prismwake" `
            --icon "prismwake.ico" `
            --version-file "prismwake_version_info.txt" `
            --collect-submodules PyQt6 `
            --collect-all rapidocr `
            --collect-all onnxruntime `
            --hidden-import ocr `
            --hidden-import ocr.engine `
            --hidden-import ocr.backends `
            --hidden-import onnxruntime `
            --hidden-import onnxruntime.capi._pybind_state `
            --hidden-import rapidocr `
            --hidden-import cv2 `
            --hidden-import pyclipper `
            --hidden-import shapely `
            --hidden-import omegaconf `
            --hidden-import yaml `
            --hidden-import history `
            --hidden-import history.storage `
            --hidden-import pinning `
            --hidden-import pinning.manager `
            --hidden-import capture `
            --hidden-import capture.smart_modes `
            --hidden-import updater `
            --hidden-import updater.single_exe `
            @dataArgs `
            $entry

          $prismwakeExe = Join-Path (Get-Location) "dist\Prismwake.exe"
          if (-not (Test-Path -LiteralPath $prismwakeExe)) {
            Write-Error "PyInstaller did not produce expected executable at $prismwakeExe"
            exit 1
          }
          if (Test-Path -LiteralPath (Join-Path (Get-Location) "dist\HDRSnipFusion.exe")) {
            Write-Error "Obsolete HDRSnipFusion.exe must not be built in v0.2.0+"
            exit 1
          }

      - name: Verify compiled Prismwake.exe (PE64 headers, release-gated neural + fallback OCR self-test & SHA-256)
        id: verify_exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prismwakeExe = Join-Path (Get-Location) "dist\Prismwake.exe"
          $expectedVer = "${{ steps.meta.outputs.app_version }}"

          $item = Get-Item -LiteralPath $prismwakeExe
          if ($item.Length -lt 5242880) {
            Write-Error "$($item.Name) size ($($item.Length) bytes) is unexpectedly small (< 5 MB)."
            exit 1
          }
          python -c "import sys, pathlib; sys.path.insert(0, '.'); import Prismwake as m; ok, reason = m.validate_windows_pe_executable(pathlib.Path(r'$prismwakeExe')); print('PE check for', r'$prismwakeExe', ':', ok, reason); sys.exit(0 if ok else 1)"

          $fvi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($prismwakeExe)
          Write-Host "PE FileVersionInfo: ProductName='$($fvi.ProductName)', FileDescription='$($fvi.FileDescription)', FileVersion='$($fvi.FileVersion)', ProductVersion='$($fvi.ProductVersion)'"
          if ($fvi.ProductName -notlike "*Prismwake*" -or $fvi.FileDescription -notlike "*Prismwake*") {
            Write-Error "PE VersionInfo ProductName/FileDescription missing 'Prismwake'"
            exit 1
          }
          if (-not $fvi.FileVersion.StartsWith($expectedVer)) {
            Write-Error "PE FileVersion '$($fvi.FileVersion)' does not start with expected '$expectedVer'"
            exit 1
          }

          $verJsonPath = Join-Path $env:RUNNER_TEMP "compiled_ver_Prismwake.json"
          if (Test-Path -LiteralPath $verJsonPath) { Remove-Item -LiteralPath $verJsonPath -Force }
          $proc = Start-Process -FilePath $prismwakeExe -ArgumentList @("--write-version-file", $verJsonPath) -Wait -PassThru -WindowStyle Hidden
          if ($proc.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $verJsonPath)) {
            Write-Error "Compiled Prismwake.exe --write-version-file failed (exit=$($proc.ExitCode))"
            exit 1
          }
          $verData = Get-Content -LiteralPath $verJsonPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($verData.version -ne $expectedVer -or $verData.tag -ne "v$expectedVer" -or -not $verData.packaged) {
            Write-Error "Compiled Prismwake.exe reported unexpected version metadata: $($verData | ConvertTo-Json -Compress)"
            exit 1
          }

          $ocrVerJsonPath = Join-Path $env:RUNNER_TEMP "compiled_ocr_verify.json"
          if (Test-Path -LiteralPath $ocrVerJsonPath) { Remove-Item -LiteralPath $ocrVerJsonPath -Force }
          $procOcr = Start-Process -FilePath $prismwakeExe -ArgumentList @("--write-ocr-verify-file", $ocrVerJsonPath, "--require-neural") -Wait -PassThru -WindowStyle Hidden
          if (-not (Test-Path -LiteralPath $ocrVerJsonPath)) {
            Write-Error "Compiled Prismwake.exe --write-ocr-verify-file --require-neural failed to produce output file (exit=$($procOcr.ExitCode))"
            exit 1
          }
          $ocrData = Get-Content -LiteralPath $ocrVerJsonPath -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "=== Offline OCR Backend Self-Test Summary ==="
          Write-Host "  RapidOCR installed        : $($ocrData.summary_table.'RapidOCR installed')"
          Write-Host "  models verified           : $($ocrData.summary_table.'models verified')"
          Write-Host "  neural EXE inference      : $($ocrData.summary_table.'neural EXE inference')"
          Write-Host "  Tesseract fallback        : $($ocrData.summary_table.'Tesseract fallback')"
          Write-Host "  offline cache-cleared test: $($ocrData.summary_table.'offline cache-cleared test')"
          Write-Host "  Details                   : $($ocrData.message)"
          if ($procOcr.ExitCode -ne 0 -or -not $ocrData.ok -or -not $ocrData.neural_exe_inference_pass -or -not $ocrData.tesseract_fallback_pass -or -not $ocrData.offline_cache_cleared_pass) {
            Write-Error "Compiled Prismwake.exe FAILED release-gated neural + fallback OCR verification: $($ocrData.message)"
            exit 1
          }

          $shaPrism = (Get-FileHash -LiteralPath $prismwakeExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sizeBytes = $item.Length
          "$shaPrism  Prismwake.exe" | Out-File -FilePath (Join-Path (Get-Location) "dist\Prismwake.exe.sha256") -Encoding ascii -NoNewline
          Write-Host "Verified SHA-256 for Prismwake.exe: $shaPrism ($sizeBytes bytes)"

          "prismwake_exe=$prismwakeExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$shaPrism" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size_bytes=$sizeBytes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify modern single-EXE updater replacement, PID ancestry, rollback & staging cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $entry = "${{ steps.meta.outputs.entry_script }}"
          $baseExe = "${{ steps.verify_exe.outputs.prismwake_exe }}"
          $baseVer = "${{ steps.meta.outputs.app_version }}"

          $verParts = $baseVer.Split(".")
          $nextPatch = [int]$verParts[2] + 1
          $nextVer = "$($verParts[0]).$($verParts[1]).$nextPatch"

          $testRoot = Join-Path $env:RUNNER_TEMP "prismwake_single_exe_updater_test"
          if (Test-Path -LiteralPath $testRoot) {
            Remove-Item -LiteralPath $testRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null

          $nextSrc = Join-Path $testRoot "Prismwake_vNext.py"
          $rawSrc = Get-Content -LiteralPath $entry -Raw -Encoding UTF8
          $patchedSrc = [regex]::Replace(
            $rawSrc,
            '(?m)^APP_VERSION\s*(?::\s*str\s*)?=\s*["''][0-9]+\.[0-9]+\.[0-9]+["'']',
            "APP_VERSION: str = `"$nextVer`""
          )
          Set-Content -LiteralPath $nextSrc -Value $patchedSrc -Encoding UTF8

          $pyiWork = Join-Path $testRoot "build"
          $pyiDist = Join-Path $testRoot "dist_next"
          $pyiSpec = Join-Path $testRoot "spec"
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "Prismwake_vNext" `
            --icon "prismwake.ico" `
            --version-file "prismwake_version_info.txt" `
            --workpath $pyiWork `
            --distpath $pyiDist `
            --specpath $pyiSpec `
            --collect-submodules PyQt6 `
            $nextSrc

          $nextExe = Join-Path $pyiDist "Prismwake_vNext.exe"
          if (-not (Test-Path -LiteralPath $nextExe)) {
            Write-Error "Failed to build second test executable at $nextExe"
            exit 1
          }

          $testScript = Join-Path $testRoot "run_single_exe_validation.py"
          $pyCode = @'
          import json
          import os
          from pathlib import Path
          import secrets
          import shutil
          import subprocess
          import sys

          sys.path.insert(0, os.getcwd())
          import Prismwake as m

          base_exe_src = Path(sys.argv[1]).resolve()
          next_exe_src = Path(sys.argv[2]).resolve()
          base_ver = sys.argv[3].strip()
          next_ver = sys.argv[4].strip()
          work_root = Path(sys.argv[5]).resolve()

          install_dir = work_root / "install"
          staging_root = work_root / "updates"
          install_dir.mkdir(parents=True, exist_ok=True)
          staging_root.mkdir(parents=True, exist_ok=True)

          installed_exe = install_dir / "Prismwake.exe"
          shutil.copy2(base_exe_src, installed_exe)
          base_sha = m.compute_file_sha256(installed_exe)
          next_sha = m.compute_file_sha256(next_exe_src)
          assert base_sha != next_sha

          vnext_dir = staging_root / f"v{next_ver}"
          vnext_dir.mkdir(parents=True, exist_ok=True)
          staged_next = vnext_dir / "Prismwake.exe"
          shutil.copy2(next_exe_src, staged_next)

          helper_exe, manifest_path = m.prepare_staged_update_transaction(
              staged_exe=staged_next,
              target_version=next_ver,
              expected_sha256=next_sha,
              target_exe=installed_exe,
              restart_after_update=True,
              staging_root=staging_root,
          )
          os.environ["HDRSNIP_VERIFY_STARTUP_ONLY"] = "1"
          try:
              rc_update = m.run_staged_update_helper(
                  str(manifest_path),
                  allowed_staging_root=staging_root,
                  post_launch_verify_sec=25.0,
              )
          finally:
              os.environ.pop("HDRSNIP_VERIFY_STARTUP_ONLY", None)
          assert rc_update == 0
          assert m.compute_file_sha256(installed_exe) == next_sha

          vfail_dir = staging_root / "v9.9.9"
          vfail_dir.mkdir(parents=True, exist_ok=True)
          staged_fail = vfail_dir / "Prismwake.exe"
          shutil.copy2(base_exe_src, staged_fail)
          helper_fail, manifest_fail = m.prepare_staged_update_transaction(
              staged_exe=staged_fail,
              target_version="9.9.9",
              expected_sha256=base_sha,
              target_exe=installed_exe,
              restart_after_update=False,
              staging_root=staging_root,
          )
          os.environ["HDRSNIP_SIMULATE_HUNG_STARTUP"] = "1"
          try:
              rc_fail = m.run_staged_update_helper(
                  str(manifest_fail),
                  allowed_staging_root=staging_root,
                  post_launch_verify_sec=3.0,
              )
          finally:
              os.environ.pop("HDRSNIP_SIMULATE_HUNG_STARTUP", None)
          assert rc_fail == 6
          assert m.compute_file_sha256(installed_exe) == next_sha

          m.cleanup_stale_update_staging(next_ver, staging_root)
          assert not vnext_dir.exists()
          print("ALL SINGLE-EXE WINDOWS PYINSTALLER UPDATER CHECKS PASSED!")
          '@
          Set-Content -LiteralPath $testScript -Value $pyCode -Encoding UTF8
          python $testScript $baseExe $nextExe $baseVer $nextVer $testRoot
          Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload Windows build artifacts (Prismwake.exe + Prismwake.exe.sha256 + icon)
        uses: actions/upload-artifact@v4
        with:
          name: Prismwake-Windows-x64-v${{ steps.meta.outputs.app_version }}
          path: |
            dist/Prismwake.exe
            dist/Prismwake.exe.sha256
            prismwake.ico
            prismwake_version_info.txt
            BENCHMARK_OCR_V020.json
            BENCHMARK_OCR_V020.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified Prismwake.exe and SHA-256 to v0.2.0 GitHub Release
        if: steps.meta.outputs.is_tag == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.meta.outputs.app_version == '0.2.0')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v${{ steps.meta.outputs.app_version }}"
          $ver = "${{ steps.meta.outputs.app_version }}"
          $prismwakeExe = "${{ steps.verify_exe.outputs.prismwake_exe }}"
          $sha256 = "${{ steps.verify_exe.outputs.sha256 }}"
          $sizeBytes = "${{ steps.verify_exe.outputs.size_bytes }}"

          $notesFile = Join-Path $env:RUNNER_TEMP "release_notes_$tag.md"
          $notesLines = @(
            "## Prismwake $tag — The Productivity Update",
            "*Catch the light. Keep the detail.*",
            "",
            "### Official Standalone Windows 10/11 Executable",
            "- **Asset**: ``Prismwake.exe`` (64-bit standalone PyInstaller build with offline RapidOCR ONNX neural + Tesseract fallback OCR, pinned screenshots, searchable SQLite history, and smart capture modes)",
            "- **Checksum File**: ``Prismwake.exe.sha256``",
            "- **Version**: ``v$ver``",
            "- **Size**: ``$sizeBytes`` bytes",
            "- **SHA-256**: ``$sha256``",
            "",
            "```text",
            "$sha256  Prismwake.exe",
            "```"
          )
          $notesLines -join "`n" | Out-File -FilePath $notesFile -Encoding utf8

          $releaseExists = $false
          try {
            gh release view $tag --repo "${{ github.repository }}" | Out-Null
            $releaseExists = $true
          } catch {
            $releaseExists = $false
          }

          if (-not $releaseExists) {
            gh release create $tag `
              "$prismwakeExe#Prismwake.exe" `
              "dist\Prismwake.exe.sha256#Prismwake.exe.sha256" `
              --repo "${{ github.repository }}" `
              --title "Prismwake $tag — The Productivity Update" `
              --notes-file $notesFile `
              --target $env:GITHUB_SHA
          } else {
            gh release upload $tag `
              "$prismwakeExe#Prismwake.exe" `
              "dist\Prismwake.exe.sha256#Prismwake.exe.sha256" `
              --repo "${{ github.repository }}" `
              --clobber
          }

      - name: Verify published GitHub Release single-EXE asset & digest metadata
        if: steps.meta.outputs.is_tag == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.meta.outputs.app_version == '0.2.0')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v${{ steps.meta.outputs.app_version }}"
          $expectedSha = "${{ steps.verify_exe.outputs.sha256 }}"
          $expectedSize = [int64]"${{ steps.verify_exe.outputs.size_bytes }}"

          $relJson = gh api "repos/${{ github.repository }}/releases/tags/$tag"
          $rel = $relJson | ConvertFrom-Json

          $exeAsset = $rel.assets | Where-Object { $_.name -eq "Prismwake.exe" } | Select-Object -First 1
          if (-not $exeAsset) {
            Write-Error "GitHub Release $tag is missing required asset 'Prismwake.exe'!"
            exit 1
          }
          if ($exeAsset.state -ne "uploaded") {
            Write-Error "Prismwake.exe asset state is '$($exeAsset.state)' (expected 'uploaded')."
            exit 1
          }
          if ([int64]$exeAsset.size -ne $expectedSize) {
            Write-Error "Uploaded Prismwake.exe size ($($exeAsset.size)) does not match built size ($expectedSize)."
            exit 1
          }
          $legacyAsset = $rel.assets | Where-Object { $_.name -eq "HDRSnipFusion.exe" }
          if ($legacyAsset) {
            Write-Error "GitHub Release $tag must NOT contain retired alias 'HDRSnipFusion.exe'!"
            exit 1
          }
          Write-Host "Successfully verified Prismwake.exe on GitHub Release $tag (url=$($exeAsset.browser_download_url))."
