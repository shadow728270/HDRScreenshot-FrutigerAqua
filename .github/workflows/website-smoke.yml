name: Validate Prismwake v0.2.0 website
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/website-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frontend JS and versioned metadata
        run: |
          node --check docs/prismwake.js
          python - <<'PYTEST'
          from pathlib import Path
          h=Path('docs/index.html').read_text(encoding='utf-8')
          assert 'Prismwake v0.2.0' in h
          assert 'prismwake.css' in h and 'prismwake.js' in h
          assert Path('docs/prismwake.css').is_file()
          assert Path('docs/prismwake.js').is_file()
          assert Path('docs/assets/prismwake-mark.svg').is_file()
          assert 'releases/latest/download/Prismwake.exe' in h
          print('Website v0.2.0 smoke: PASS')
          PYTEST
