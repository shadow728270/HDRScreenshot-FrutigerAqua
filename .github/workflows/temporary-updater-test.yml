name: Temporary v0.1.0 Hotfix updater test (internally v0.1.2)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-updater-test.yml'
permissions:
  contents: write
jobs:
  publish-temporary-test-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Create isolated temporary version branch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git checkout -b updater-test-v0.1.2
          @'
          from pathlib import Path
          p = Path("HDRSnipFusion.py")
          s = p.read_text(encoding="utf-8")
          old = 'APP_VERSION: str = "0.1.1"'
          assert s.count(old) == 1, "Unexpected APP_VERSION in main"
          p.write_text(s.replace(old, 'APP_VERSION: str = "0.1.2"'), encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Failed to prepare test-only source" }
          git add HDRSnipFusion.py
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Temporary updater validation build v0.1.2"
      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PyQt6 numpy Pillow
      - name: Build temporary newer version
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name HDRSnipFusion --collect-submodules PyQt6 HDRSnipFusion.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
      - name: Verify executable and compiled test version
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path 'dist/HDRSnipFusion.exe').Path
          $size = (Get-Item $exe).Length
          if ($size -lt 5242880) { throw "Executable unexpectedly small" }
          $versionFile = Join-Path $env:RUNNER_TEMP 'temporary-updater-test-version.json'
          $proc = Start-Process -FilePath $exe -ArgumentList @('--write-version-file', $versionFile) -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or -not (Test-Path $versionFile)) { throw "Packaged version test failed" }
          $ver = Get-Content $versionFile -Raw | ConvertFrom-Json
          if ($ver.version -ne '0.1.2' -or $ver.tag -ne 'v0.1.2' -or -not $ver.packaged) { throw "Packaged version mismatch" }
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  HDRSnipFusion.exe" | Out-File -FilePath 'dist/HDRSnipFusion.exe.sha256' -Encoding ascii -NoNewline
          Write-Host "Temporary update candidate verified: version=$($ver.version), size=$size, SHA256=$sha"
      - name: Publish isolated temporary test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          # GitHub Actions-created tag/branch pushes do not trigger another workflow,
          # avoiding the production tagged-release pipeline.
          git tag v0.1.2
          git push origin updater-test-v0.1.2
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish isolated test branch" }
          git push origin refs/tags/v0.1.2
          if ($LASTEXITCODE -ne 0) { throw "Failed to create temporary test tag" }
          $notes = @'
          TEMPORARY UPDATER VERIFICATION RELEASE. This is labeled as a v0.1.0 hotfix for visibility, but its actual tag and compiled version are v0.1.2 so that the v0.1.1 auto-updater detects it.

          Do not install manually unless testing. This release will be deleted after the updater is validated. The permanent public hotfix will be v0.1.1.
          '@
          $notesFile = Join-Path $env:RUNNER_TEMP 'temporary-hotfix-notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding UTF8
          gh release create v0.1.2 'dist/HDRSnipFusion.exe#HDRSnipFusion.exe' 'dist/HDRSnipFusion.exe.sha256#HDRSnipFusion.exe.sha256' --repo "$env:GITHUB_REPOSITORY" --title 'v0.1.0 Hotfix (Temporary updater test)' --notes-file $notesFile --verify-tag --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish test release" }
