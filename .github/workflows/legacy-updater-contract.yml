name: Verify legacy updater migration contract

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_legacy_updater_contract.py'
      - 'docs/PRISMWAKE_V013_MIGRATION.md'
      - '.github/workflows/legacy-updater-contract.yml'
      - 'HDRSnipFusion.py'
  pull_request:
    branches: [main]
    paths:
      - 'tests/**'
      - 'HDRSnipFusion.py'
      - '.github/workflows/legacy-updater-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-v012-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository and historical release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal testing dependencies
        run: python -m pip install "numpy>=1.24" "Pillow>=10"
      - name: Assert that original v0.1.2 updater accepts the v0.1.3 compatibility asset
        run: python -m unittest discover -s tests -p 'test_legacy_updater_contract.py' -v
